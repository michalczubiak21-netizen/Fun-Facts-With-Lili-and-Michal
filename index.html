<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fun Facts">
<title>A Fun Fact for You</title>
<style>
:root{--bg:#fff3f5;--card:#fff;--ink:#3b2630;--mut:#8a6b76;--acc:#e0566f;--line:#f4d5dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1317;--card:#2a1b21;--ink:#fbe9ee;--mut:#c49aa8;--acc:#ff7b93;--line:#432a34;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);text-align:center;margin:8px 0 18px;font-family:system-ui,sans-serif}
.today{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 6px 24px rgba(224,86,111,.12)}
.today .d{font:13px system-ui,sans-serif;color:var(--mut);margin-bottom:10px}
.today .t{font-size:22px;line-height:1.45}
.heart{font-size:26px;color:var(--acc);margin-bottom:6px}
h2{font:600 13px system-ui,sans-serif;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:34px 0 10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.item .d{font:12px system-ui,sans-serif;color:var(--mut);margin-bottom:4px}
.msg{text-align:center;color:var(--mut);font-style:italic;padding:14px}
</style></head>
<body><main>
<h1>A fun fact for you</h1>
<div id="today" class="today"></div>
<div id="past"></div>
</main>
<script>
/* ============ ADD NEW FACTS HERE ============
   One line per fact: { date: "YYYY-MM-DD", text: "..." },
   A fact only appears on or after its date, so you can write them ahead of time.
   Use \" for a quote mark inside a fact. */
const FACTS = [
  { date: "2026-11-16", text: "Hi Lili." },
  { date: "2026-11-17", text: "Honey never spoils. Edible honey has been found in ancient Egyptian tombs." },
  { date: "2026-11-18", text: "Octopuses have three hearts." },
];
/* ============================================ */

function el(tag, cls, txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const now=new Date(), pad=n=>String(n).padStart(2,'0');
const todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const fmt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})};
const shown=FACTS.filter(f=>f.date<=todayStr).sort((a,b)=>b.date.localeCompare(a.date));
const today=document.getElementById('today'), past=document.getElementById('past');
if(!shown.length){today.append(el('div','msg','Your first fun fact is on its way ♥'))}
else{
  const f=shown[0];
  today.append(el('div','heart','♥'),el('div','d',fmt(f.date)),el('div','t',f.text));
  if(shown.length>1){
    past.append(el('h2',null,'Earlier facts'));
    shown.slice(1).forEach(p=>{const i=el('div','item');i.append(el('div','d',fmt(p.date)),el('div',null,p.text));past.append(i)});
  }
}
</script></body></html>
