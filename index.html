<title>Fun Facts for Lili ♥</title>
<style>
:root{--bg:#fff3f5;--card:#fff;--ink:#3b2630;--mut:#8a6b76;--acc:#e0566f;--line:#f4d5dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1317;--card:#2a1b21;--ink:#fbe9ee;--mut:#c49aa8;--acc:#ff7b93;--line:#432a34;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
main{max-width:520px;margin:0 auto;padding:22px 18px 56px}
.photo{width:100%;display:block;border-radius:22px;border:3px solid var(--card);box-shadow:0 8px 28px rgba(224,86,111,.25)}
h1{font-size:28px;line-height:1.2;text-align:center;margin:22px 0 6px;color:var(--acc);font-weight:700}
.count{text-align:center;font:600 15px system-ui,sans-serif;color:var(--mut);margin-bottom:24px}
.today{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 6px 24px rgba(224,86,111,.12)}
.today .d{font:13px system-ui,sans-serif;color:var(--mut);margin-bottom:10px;text-align:center}
.today .t{white-space:pre-line;font-size:18px}
.heart{font-size:26px;color:var(--acc);margin-bottom:4px;text-align:center}
h2{font:600 13px system-ui,sans-serif;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:34px 0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .d{font:12px system-ui,sans-serif;color:var(--acc);margin-bottom:2px}
summary .p{font-size:15px;color:var(--mut)}
details .b{white-space:pre-line;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.msg{text-align:center;color:var(--mut);font-style:italic;padding:14px}
</style></head>

const START = new Date(2025, 10, 9); /* the day you got together: year, month (0 = Jan), day */

function el(tag, cls, txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const now=new Date(), pad=n=>String(n).padStart(2,'0');
const todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const fmt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})};
const pl=(n,w)=>n+' '+w+(n===1?'':'s');

/* years, months, days together */
(function(){
  let y=now.getFullYear()-START.getFullYear(), m=now.getMonth()-START.getMonth(), d=now.getDate()-START.getDate();
  if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  if(y<0)return;

})();
